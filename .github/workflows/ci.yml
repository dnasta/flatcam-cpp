# Compila y prueba el port en Linux y Windows (en macOS se prueba en la máquina del usuario).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (Ubuntu 24.04, GCC)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build libgeos-dev liblzma-dev \
            libgtest-dev qt6-base-dev qt6-svg-dev libqt6opengl6-dev qt6-serialport-dev libgl-dev tcl-dev \
            libfreetype-dev gdb
      - name: Configurar
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFLATCAM_BUILD_DOCS=OFF
      - name: Compilar
        run: cmake --build build
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure
      - name: Traza de los tests que fallaron (gdb)
        if: failure()
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          f=build/Testing/Temporary/LastTestsFailed.log
          [ -f "$f" ] || exit 0
          for name in $(cut -d: -f2 "$f"); do
            case "$name" in Gui*) exe=build/tests/gui_tests ;; *) exe=build/tests/core_tests ;; esac
            gdb -batch -ex run -ex "thread apply all bt 25" --args "$exe" --gtest_filter="$name" 2>&1 | grep -v "Line ignored" | tail -80
          done

  windows:
    name: Windows (MSVC 2022)
    runs-on: windows-2022
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v4
      - name: Caché de vcpkg
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-${{ runner.os }}-geos-lzma-freetype-gtest-tcl-v1
      - name: Dependencias (vcpkg)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "${{ github.workspace }}/vcpkg-cache" | Out-Null
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg" install geos liblzma freetype gtest tcl
      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: win64_msvc2022_64
          modules: qtserialport
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configurar
        shell: pwsh
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFLATCAM_BUILD_DOCS=OFF
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Compilar
        run: cmake --build build
      - name: Tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $env:PATH = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin;$env:PATH"
          ctest --test-dir build --output-on-failure
